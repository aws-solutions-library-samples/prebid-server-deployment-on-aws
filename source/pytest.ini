[pytest]
# Make the Lambda/custom-resource source packages importable without the Poetry
# editable installs. The v2 TypeScript-CDK migration left the Poetry
# [tool.poetry.group.local] editable installs unresolvable (the "infrastructure"
# package is now TypeScript, so `poetry install`/`poetry run pytest` fail), which
# is what previously put these packages on sys.path. These roots (relative to this
# file's directory, source/) replace that wiring: the custom_resources and
# prebid_server packages live under infrastructure/, aws_solutions under the
# cdk_solution_helper_py helpers, and the Lambda-layer python/ dirs carry
# cloudwatch_metrics. Run the suite with: python -m pytest tests/unit_tests
pythonpath =
    infrastructure
    cdk_solution_helper_py/helpers_common
    cdk_solution_helper_py/helpers_cdk
    infrastructure/aws_lambda_layers/aws_solutions/python
    infrastructure/aws_lambda_layers/metrics_layer/python
env =
    MOTO_ACCOUNT_ID=111111111111
    POWERTOOLS_TRACE_DISABLED=1
    SOLUTION_ID=SO9999test
    SOLUTION_VERSION=v99.99.99
    SOLUTION_NAME=Guidance for Deploying a Prebid Server on AWS
    AWS_REGION=us-east-1
    AWS_DEFAULT_REGION=us-east-1
    RESOURCE_PREFIX=prefix
    TEAM=team
    PIPELINE=pipeline
    STAGE=stage
    stage_bucket=stage_bucket
    ENV=dev
    OCTAGON_PIPELINE_TABLE_NAME=octagon-Pipelines-dev-prefix
    OCTAGON_DATASET_TABLE_NAME=octagon-Datasets-dev-prefix
    OCTAGON_METADATA_TABLE_NAME=octagon-Object-Metadata-dev-prefix
    SDLF_CUSTOMER_CONFIG=sdlf-customer-config
    STACK_NAME=prefix
    METRICS_NAMESPACE=metrics-namespace
norecursedirs = cdk_solution_helper_py infrastructure scripts cdk.out .venv
markers=
    no_cdk_lambda_mock: marks test that need to build AWS Lambda Functions or Layers with CDK
    order: marks test execution order dependencies using pytest-ordering plugin